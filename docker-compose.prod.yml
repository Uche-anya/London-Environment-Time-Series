services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - envnet
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-wire the datasource + dashboard on a fresh box (no manual clicking).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - timescaledb
    networks:
      - envnet
    restart: always

  # One-shot loader. Behind the "run" profile so `up` never starts it.
  # Run it with: docker compose -f docker-compose.prod.yml run --rm pipeline
  pipeline:
    # On the box: set PIPELINE_IMAGE=<ecr_repository_url>:latest and
    # `docker compose pull pipeline` — no build happens on the t3.micro.
    # Left unset, it builds locally from Dockerfile.pipeline (dev convenience).
    image: ${PIPELINE_IMAGE:-london-environment-pipeline:latest}
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    env_file:
      - .env
    volumes:
      - pipeline_data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - envnet
    restart: "no"
    profiles:
      - run

volumes:
  timescale_data:
  grafana_data:
  pipeline_data:

networks:
  envnet:
    driver: bridge
