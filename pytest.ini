[pytest]
# Only collect code tests from tests/. Great Expectations data validation lives
# in data_quality/ and is run by the Airflow DAG, not by pytest.
testpaths = tests

# Test categories. Tag tests with @pytest.mark.<name> (or a module-level
# `pytestmark`) so CI can select subsets, e.g. `pytest -m "not integration"`.
markers =
    unit: fast, isolated tests of pure code/logic with no external services
    integration: tests that exercise external systems (TimescaleDB, real data files)
