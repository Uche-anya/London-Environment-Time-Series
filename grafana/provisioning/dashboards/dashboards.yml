apiVersion: 1

# Loads dashboard JSON files from disk on startup. The compose file mounts
# ./grafana/dashboards to the path below.
providers:
  - name: London Environment
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
