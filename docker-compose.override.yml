services:
  webserver:
    env_file:
      - .env
    networks:
      - envnet
    volumes:
      - ./pipelines:/usr/local/airflow/pipelines
      - ./data_quality:/usr/local/airflow/data_quality
      - ./data:/usr/local/airflow/data
      - ./sql:/usr/local/airflow/sql
      - ./src:/usr/local/airflow/src

  scheduler:
    env_file:
      - .env
    networks:
      - envnet
    volumes:
      - ./pipelines:/usr/local/airflow/pipelines
      - ./data_quality:/usr/local/airflow/data_quality
      - ./data:/usr/local/airflow/data
      - ./sql:/usr/local/airflow/sql
      - ./src:/usr/local/airflow/src

  triggerer:
    env_file:
      - .env
    networks:
      - envnet
    volumes:
      - ./pipelines:/usr/local/airflow/pipelines
      - ./data_quality:/usr/local/airflow/data_quality
      - ./data:/usr/local/airflow/data
      - ./sql:/usr/local/airflow/sql
      - ./src:/usr/local/airflow/src

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - envnet

  grafana:
    image: grafana/grafana-oss:latest
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb
    networks:
      - envnet

volumes:
  timescale_data:
  grafana_data:

networks:
  envnet:
    driver: bridge