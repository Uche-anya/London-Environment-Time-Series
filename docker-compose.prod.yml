# Slim production stack for a free-tier box (EC2 t3.micro, ~1 GB RAM).
#
# Airflow needs ~4 GB RAM and won't fit a t3.micro, so this stack drops it:
#   timescaledb   serving layer (Postgres + Timescale extension; holds the metrics)
#   grafana       dashboards on :3000 — the thing you screenshot for the portfolio
#   pipeline      one-shot runner (run_pipeline.py) that loads the data; NOT a
#                 long-running service — it's behind a compose profile so it does
#                 not start with `up`.
#
# Local development still uses Airflow via `astro dev start` (docker-compose.override.yml).
#
# Usage on the box:
#   cp .env.example .env          # fill in real values
#   docker compose -f docker-compose.prod.yml up -d            # start timescaledb + grafana
#   docker compose -f docker-compose.prod.yml run --rm pipeline  # run the pipeline once
#   # then open http://<EIP>:3000 for Grafana

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - envnet
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb
    networks:
      - envnet
    restart: always

  # One-shot loader. Behind the "run" profile so `up` never starts it.
  # Run it with: docker compose -f docker-compose.prod.yml run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: london-environment-pipeline:latest
    env_file:
      - .env
    volumes:
      - pipeline_data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - envnet
    restart: "no"
    profiles:
      - run

volumes:
  timescale_data:
  grafana_data:
  pipeline_data:

networks:
  envnet:
    driver: bridge
